{% extends "base.html" %}
{% load static %}

{% block title %}Profile — Teamly{% endblock %}

{% block extra_css %}<link rel="stylesheet" href="{% static 'css/profile/profile.css' %}">{% endblock %}

{% block content %}
<section class="panel" aria-labelledby="profile-heading">
    <h1 id="profile-heading">Profile</h1>
    <p class="meta">Signed in as {{ user.username }}.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Save profile</button>
    </form>
    <p class="meta"><a href="{% url 'home:home' %}">Back to Home</a></p>
</section>
{% endblock %}

{% block extra_js %}<script src="{% static 'js/profile/profile.js' %}"></script>{% endblock %}
