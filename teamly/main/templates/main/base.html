<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Teamly{% endblock %}</title>
    <style>
        /* Teamly palette — tokens copied from docs/DESIGN.md. One accent only. */
        :root {
            color-scheme: light dark;
            --background: #F7F7F5;
            --surface: #FFFFFF;
            --surface-subtle: #F0F0ED;
            --foreground: #171717;
            --foreground-muted: #666666;
            --foreground-subtle: #909090;
            --border: #D9D9D5;
            --border-strong: #B8B8B3;
            --accent: #2563EB;
            --accent-foreground: #FFFFFF;
            --success: #287A4B;
            --warning: #A16207;
            --danger: #B42318;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111111;
                --surface: #181818;
                --surface-subtle: #222222;
                --foreground: #F2F2F0;
                --foreground-muted: #A3A3A0;
                --foreground-subtle: #777774;
                --border: #303030;
                --border-strong: #454545;
                --accent: #6EA8FF;
                --accent-foreground: #0B1220;
                --success: #58A978;
                --warning: #D19A38;
                --danger: #E06B61;
            }
        }

        /* Sharp geometry: square corners everywhere (DESIGN.md). */
        * { box-sizing: border-box; border-radius: 0 !important; }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
            background: var(--background);
            color: var(--foreground);
        }

        /* Typography hierarchy: title > heading > body > metadata. */
        h1 { font-size: 1.5rem; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
        h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
        p { margin: 0 0 0.75rem; }
        .meta { color: var(--foreground-muted); font-size: 0.875rem; }

        a { color: var(--accent); }
        a:hover { text-decoration-thickness: 2px; }

        /* Nav: thin bottom border, no shadow. */
        header nav {
            display: flex; gap: 1rem; align-items: center;
            padding: 0.75rem 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        header nav .brand { font-weight: 700; color: var(--foreground); }
        header nav a[aria-current="page"] { font-weight: 700; }

        main { max-width: 30rem; margin: 0 auto; padding: 1rem; }

        /* Cards = organizational containers: border + spacing, no shadow. */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.25rem;
        }

        /* Forms: rectangular inputs, thin border, clear focus. */
        form p { display: flex; flex-direction: column; gap: 0.25rem; margin: 0 0 0.75rem; }
        label { font-weight: 600; font-size: 0.9rem; }
        input {
            padding: 0.6rem;
            font-size: 1rem;
            background: var(--surface);
            color: var(--foreground);
            border: 1px solid var(--border-strong);
        }
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }
        .helptext { color: var(--foreground-muted); font-size: 0.8rem; }
        .errorlist { color: var(--danger); font-size: 0.875rem; margin: 0.25rem 0; padding-left: 1.25rem; }

        /* Buttons: compact, rectangular. Primary = accent, secondary = border. */
        button {
            padding: 0.55rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--accent);
            transition: transform 80ms ease;
        }
        button:active { transform: translateY(1px); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .btn-primary { background: var(--accent); color: var(--accent-foreground); }
        .btn-primary:hover { filter: brightness(0.94); }
        .btn-secondary { background: transparent; color: var(--foreground); border-color: var(--border-strong); }
        .btn-secondary:hover { border-color: var(--foreground); }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <span class="brand">Teamly</span>
            {% if user.is_authenticated %}
                <a href="{% url 'home' %}">Home</a>
                <form method="post" action="{% url 'logout' %}" style="display: inline; margin-left: auto;">
                    {% csrf_token %}
                    <button type="submit" class="btn-secondary">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
