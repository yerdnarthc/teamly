{% extends "main/base.html" %}

{% block title %}Login — Teamly{% endblock %}

{% block content %}
<section class="panel" aria-labelledby="login-heading">
    <h1 id="login-heading">Login</h1>
    <p class="meta">Access your assignments.</p>
    <form method="post">
        {% csrf_token %}
        {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Login</button>
    </form>
    <p class="meta">No account yet? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
